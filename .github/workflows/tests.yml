name: Backend Tests

# Audit finding NEW-T-01: the suite existed but nothing ran it on a change, so
# a defect that silently emptied both LLM prompts shipped unnoticed. These tests
# need neither Ollama nor Supabase: the model is stubbed and the Gold layer is
# pure arithmetic.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # app/database.py raises at import time without these, and several tests
        # import the orchestrator. The values are placeholders: nothing in this
        # suite makes a network call.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: pytest tests/ -q

  # deployment_plan.md §4.2. requirements.txt is what the Docker image installs,
  # and it once silently fell six packages behind pyproject.toml - including
  # slowapi and langchain-ollama, without which the server cannot start.
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt
          git diff --exit-code -- requirements.txt

  # The image Render deploys must build and import. Catches a dependency that
  # installs on a developer's machine but not on python:3.12-slim.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t invr-api backend
      - name: App imports inside the image
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_ANON_KEY=placeholder -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            invr-api python -c "import main; print('ok')"
