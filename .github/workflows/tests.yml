name: Backend Tests

# Audit finding NEW-T-01: the suite existed but nothing ran it on a change, so
# a defect that silently emptied both LLM prompts shipped unnoticed. These tests
# need neither Ollama nor Supabase: the model is stubbed and the Gold layer is
# pure arithmetic.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # app/database.py raises at import time without these, and several tests
        # import the orchestrator. The values are placeholders: nothing in this
        # suite makes a network call.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: pytest tests/ -q
